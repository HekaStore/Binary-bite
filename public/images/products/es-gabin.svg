<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#F8FAFC"/>
  <!-- Decorative binary grid lines -->
  <path d="M40 0V300M80 0V300M120 0V300M160 0V300M200 0V300M240 0V300M280 0V300M320 0V300M360 0V300" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M0 40H400M0 80H400M0 120H400M0 160H400M0 200H400M0 240H400M0 280H400" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Plate / Ice mist -->
  <ellipse cx="200" cy="230" rx="120" ry="38" fill="#D6E6F2"/>
  <ellipse cx="200" cy="225" rx="110" ry="28" fill="#FFFFFF" stroke="#1E56A0" stroke-width="2"/>

  <!-- Gabin Ice Cream Sandwich 1 (Chocolate/Milo) -->
  <g transform="translate(130, 85)">
    <!-- Bottom Gabin Biscuit -->
    <path d="M10 95 L95 70 L135 105 L50 130 Z" fill="#D97706" stroke="#0A2463" stroke-width="2"/>
    <path d="M15 97 L92 74 L128 105 L52 126 Z" fill="#F59E0B"/>
    <!-- Biscuit dots/holes -->
    <circle cx="35" cy="100" r="1.5" fill="#78350F"/>
    <circle cx="55" cy="95" r="1.5" fill="#78350F"/>
    <circle cx="75" cy="88" r="1.5" fill="#78350F"/>
    <circle cx="70" cy="112" r="1.5" fill="#78350F"/>
    <circle cx="90" cy="105" r="1.5" fill="#78350F"/>

    <!-- Thick Ice Cream Block in Middle (Chocolate/Milo) -->
    <path d="M10 65 L95 40 L135 75 L50 100 Z" fill="#582C12" stroke="#0A2463" stroke-width="1.5"/>
    <path d="M10 65 L50 100 L50 130 L10 95 Z" fill="#451A03" stroke="#0A2463" stroke-width="2"/>
    <path d="M50 100 L135 75 L135 105 L50 130 Z" fill="#78350F" stroke="#0A2463" stroke-width="2"/>

    <!-- Vanilla fla ripple inside block -->
    <path d="M50 112 Q 90 90 135 88" stroke="#FEF3C7" stroke-width="4" stroke-linecap="round"/>

    <!-- Top Gabin Biscuit -->
    <path d="M10 50 L95 25 L135 60 L50 85 Z" fill="#F59E0B" stroke="#0A2463" stroke-width="2"/>
    <!-- Sugar crystals on top biscuit -->
    <circle cx="35" cy="55" r="1.5" fill="#FEF3C7"/>
    <circle cx="55" cy="48" r="1.5" fill="#FEF3C7"/>
    <circle cx="75" cy="42" r="1.5" fill="#FEF3C7"/>
    <circle cx="95" cy="38" r="1.5" fill="#FEF3C7"/>
    <circle cx="70" cy="65" r="1.5" fill="#FEF3C7"/>
    <circle cx="90" cy="58" r="1.5" fill="#FEF3C7"/>
    <circle cx="110" cy="52" r="1.5" fill="#FEF3C7"/>
    <circle cx="45" cy="72" r="1.5" fill="#FEF3C7"/>
  </g>

  <!-- Ice Flake Decor -->
  <path d="M85 140 L85 160 M75 150 L95 150 M78 143 L92 157 M78 157 L92 143" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <path d="M305 130 L305 150 M295 140 L315 140 M298 133 L312 147 M298 147 L312 133" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>

  <!-- Badges -->
  <rect x="24" y="24" width="70" height="24" rx="4" fill="#0A2463"/>
  <text x="32" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#D6E6F2">BB-04</text>
  <rect x="300" y="24" width="76" height="24" rx="4" fill="#2563EB"/>
  <text x="312" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF">Rp9.000</text>
</svg>

