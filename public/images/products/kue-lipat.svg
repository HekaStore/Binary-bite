<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#F8FAFC"/>
  <!-- Decorative binary grid lines -->
  <path d="M40 0V300M80 0V300M120 0V300M160 0V300M200 0V300M240 0V300M280 0V300M320 0V300M360 0V300" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M0 40H400M0 80H400M0 120H400M0 160H400M0 200H400M0 240H400M0 280H400" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Background Plate / Dish -->
  <ellipse cx="200" cy="210" rx="130" ry="45" fill="#D6E6F2"/>
  <ellipse cx="200" cy="205" rx="120" ry="38" fill="#FFFFFF" stroke="#1E56A0" stroke-width="2"/>
  
  <!-- Kue Lipat (Folded Crepe/Pancake) 1 -->
  <g transform="translate(140, 100)">
    <!-- Folded shape green pandan or golden pancake -->
    <path d="M20 90 C 20 40, 90 20, 130 50 C 150 70, 140 100, 120 110 C 90 120, 30 110, 20 90 Z" fill="#FDE047" stroke="#0A2463" stroke-width="2"/>
    <path d="M35 85 C 45 55, 95 35, 120 60" stroke="#CA8A04" stroke-width="3" stroke-linecap="round"/>
    <!-- Cream / Coconut filling lumer -->
    <path d="M70 70 C 85 65, 110 75, 115 85 C 100 95, 80 90, 70 70 Z" fill="#84CC16" stroke="#0A2463" stroke-width="1.5"/>
    <!-- Sweet chocolate / cheese drizzle -->
    <path d="M45 75 Q 60 90 85 80 Q 105 90 120 85" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Kue Lipat 2 behind -->
  <g transform="translate(100, 115)">
    <path d="M15 80 C 15 35, 80 15, 115 45 C 135 65, 125 90, 105 100 C 80 110, 25 100, 15 80 Z" fill="#FACC15" stroke="#0A2463" stroke-width="2"/>
    <path d="M40 65 C 55 60, 80 70, 85 80 C 70 90, 50 85, 40 65 Z" fill="#DC2626" stroke="#0A2463" stroke-width="1.5"/>
  </g>

  <!-- Tech badge tag -->
  <rect x="24" y="24" width="70" height="24" rx="4" fill="#0A2463"/>
  <text x="32" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#D6E6F2">BB-01</text>
  <rect x="300" y="24" width="76" height="24" rx="4" fill="#2563EB"/>
  <text x="312" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF">Rp3.000</text>
</svg>

