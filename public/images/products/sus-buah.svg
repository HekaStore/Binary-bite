<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#F8FAFC"/>
  <!-- Decorative binary grid lines -->
  <path d="M40 0V300M80 0V300M120 0V300M160 0V300M200 0V300M240 0V300M280 0V300M320 0V300M360 0V300" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M0 40H400M0 80H400M0 120H400M0 160H400M0 200H400M0 240H400M0 280H400" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Shadow plate -->
  <ellipse cx="200" cy="225" rx="110" ry="35" fill="#D6E6F2"/>
  <ellipse cx="200" cy="220" rx="100" ry="28" fill="#FFFFFF" stroke="#1E56A0" stroke-width="2"/>

  <!-- Pie Pastry Tart Cup -->
  <g transform="translate(130, 95)">
    <!-- Base Tart Crust -->
    <path d="M15 80 L35 120 C 55 135, 85 135, 105 120 L125 80 Z" fill="#D97706" stroke="#0A2463" stroke-width="2"/>
    <path d="M22 85 L38 116 C 55 128, 85 128, 102 116 L118 85" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
    <!-- Fluted edges -->
    <path d="M10 80 Q 20 70 30 80 Q 40 70 50 80 Q 60 70 70 80 Q 80 70 90 80 Q 100 70 110 80 Q 120 70 130 80" fill="#FCD34D" stroke="#0A2463" stroke-width="2"/>
    <!-- Smooth Vanilla Cream Vla -->
    <ellipse cx="70" cy="80" rx="55" ry="22" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>

    <!-- Fresh Fruit Toppings: Kiwi slice -->
    <g transform="translate(45, 62) rotate(-15)">
      <path d="M0 22 C 0 8, 18 0, 36 0 C 42 0, 48 4, 48 10 C 48 24, 25 32, 5 30 Z" fill="#84CC16" stroke="#0A2463" stroke-width="1.5"/>
      <ellipse cx="24" cy="12" rx="14" ry="7" fill="#BEF264"/>
      <!-- Seeds -->
      <circle cx="20" cy="11" r="1.5" fill="#0A2463"/>
      <circle cx="26" cy="10" r="1.5" fill="#0A2463"/>
      <circle cx="28" cy="14" r="1.5" fill="#0A2463"/>
      <circle cx="18" cy="15" r="1.5" fill="#0A2463"/>
    </g>

    <!-- Orange / Peach Segment -->
    <path d="M65 65 C 80 50, 105 55, 115 70 C 105 78, 85 82, 65 65 Z" fill="#F97316" stroke="#0A2463" stroke-width="1.5"/>
    <path d="M72 65 Q 90 58 105 70" stroke="#EA580C" stroke-width="2"/>

    <!-- Fresh Glazed Cherry / Grape -->
    <circle cx="68" cy="88" r="14" fill="#DC2626" stroke="#0A2463" stroke-width="2"/>
    <circle cx="64" cy="83" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Badges -->
  <rect x="24" y="24" width="70" height="24" rx="4" fill="#0A2463"/>
  <text x="32" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#D6E6F2">BB-02</text>
  <rect x="300" y="24" width="76" height="24" rx="4" fill="#2563EB"/>
  <text x="312" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF">Rp4.000</text>
</svg>

