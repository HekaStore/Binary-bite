<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#F8FAFC"/>
  <!-- Decorative binary grid lines -->
  <path d="M40 0V300M80 0V300M120 0V300M160 0V300M200 0V300M240 0V300M280 0V300M320 0V300M360 0V300" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M0 40H400M0 80H400M0 120H400M0 160H400M0 200H400M0 240H400M0 280H400" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Plate -->
  <ellipse cx="200" cy="225" rx="120" ry="38" fill="#D6E6F2"/>
  <ellipse cx="200" cy="220" rx="110" ry="30" fill="#FFFFFF" stroke="#1E56A0" stroke-width="2"/>

  <!-- Roll Abon Slice 1 -->
  <g transform="translate(130, 95)">
    <!-- Main cylindrical body -->
    <path d="M30 60 L100 40 L125 90 L55 110 Z" fill="#F59E0B" stroke="#0A2463" stroke-width="2"/>
    <!-- Abon coating texture -->
    <path d="M30 60 L100 40 L125 90 L55 110 Z" fill="#D97706" opacity="0.85"/>
    
    <!-- Left face of roll -->
    <ellipse cx="42" cy="85" rx="22" ry="32" fill="#FEF3C7" stroke="#0A2463" stroke-width="2"/>
    <!-- Swirl cream & meat roll pattern inside -->
    <path d="M42 62 C 55 65, 58 85, 48 95 C 38 100, 32 90, 35 80 C 37 72, 45 74, 46 80" stroke="#92400E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    
    <!-- Abon Flakes & sprinkles on surface -->
    <!-- Meat floss specs -->
    <circle cx="70" cy="55" r="3" fill="#78350F"/>
    <circle cx="85" cy="65" r="2.5" fill="#78350F"/>
    <circle cx="105" cy="75" r="3" fill="#78350F"/>
    <circle cx="75" cy="85" r="3.5" fill="#78350F"/>
    <circle cx="95" cy="95" r="2" fill="#78350F"/>
    <circle cx="60" cy="70" r="2" fill="#78350F"/>
    <!-- Scallion / chili flakes -->
    <rect x="78" y="70" width="5" height="2" rx="1" fill="#15803D" transform="rotate(25 78 70)"/>
    <rect x="92" y="55" width="4" height="2" rx="1" fill="#15803D" transform="rotate(-35 92 55)"/>
    <rect x="110" y="80" width="4" height="2" rx="1" fill="#DC2626" transform="rotate(45 110 80)"/>
    <rect x="65" y="80" width="4" height="2" rx="1" fill="#DC2626" transform="rotate(15 65 80)"/>
    <rect x="85" y="90" width="5" height="2" rx="1" fill="#15803D" transform="rotate(-15 85 90)"/>
  </g>

  <!-- Badges -->
  <rect x="24" y="24" width="70" height="24" rx="4" fill="#0A2463"/>
  <text x="32" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#D6E6F2">BB-03</text>
  <rect x="300" y="24" width="76" height="24" rx="4" fill="#2563EB"/>
  <text x="312" y="40" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF">Rp4.000</text>
</svg>

